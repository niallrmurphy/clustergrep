[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clustergrep"
dynamic = ["version"]
description = "grep for a concept rather than a string, with the distance reported"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niall Richard Murphy" }]
keywords = ["grep", "search", "semantic", "wordnet", "nlp", "cli", "logs"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
]
# WordNet is the default backend, so nltk is not optional -- an install where
# the default does not work is not an install.
dependencies = [
    "lemminflect>=0.2.3",
    "nltk>=3.8",
]

[project.optional-dependencies]
vectors = ["numpy>=1.24"]
dev = ["numpy>=1.24", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/niallrmurphy/clustergrep"
Repository = "https://github.com/niallrmurphy/clustergrep"
Issues = "https://github.com/niallrmurphy/clustergrep/issues"

[project.scripts]
clustergrep = "clustergrep.cli:main"

# Named so that `uv publish --index testpypi` resolves. TestPyPI is a wholly
# separate registry from PyPI: separate account, separate token, and uploads
# to it are throwaway -- which is what makes it the right place to check how
# the project page renders before spending a version number for real.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.hatch.version]
path = "src/clustergrep/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clustergrep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
